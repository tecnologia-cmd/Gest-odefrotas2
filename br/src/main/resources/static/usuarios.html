<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipe - Coocacer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; margin: 0; color: #1f2937; }
        
        /* CABEÇALHO */
        header { background-color: #064e3b; color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .logo-container { display: flex; align-items: center; gap: 15px; }
        .logo-img { height: 45px; background: white; padding: 5px; border-radius: 8px; }
        .btn-voltar { color: white; text-decoration: none; font-weight: bold; background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 6px; }
        .btn-voltar:hover { background: rgba(255,255,255,0.2); }

        /* PRINCIPAL */
        main { max-width: 1000px; margin: 40px auto; padding: 0 20px; }

        /* FORMULÁRIO */
        .form-card { background: white; padding: 25px; border-radius: 10px; border: 1px solid #e5e7eb; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .input-form { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; }
        label { font-weight: 600; font-size: 0.9rem; margin-bottom: 5px; display: block; }

        /* TABELA DE USUÁRIOS */
        .tabela-container { overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #064e3b; color: white; padding: 15px; text-align: left; font-size: 0.9rem; }
        td { padding: 15px; border-bottom: 1px solid #eee; font-size: 0.95rem; }
        tr:hover { background-color: #f9fafb; }

        /* BOTÕES */
        .btn-moderno { padding: 8px 15px; border-radius: 6px; color: white; font-weight: bold; font-size: 0.85rem; }
        .verde { background: #10b981; }
        .azul { background: #0284c7; }
        .vermelho { background: #a21c12; }
        .cinza { background: #6b7280; }
        .btn-full { width: 100%; margin-top: 10px; padding: 12px; }

    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <div>
                <h1 style="margin:0; font-size:1.4rem;">EQUIPE & MOTORISTAS</h1>
                <span style="font-size:0.8rem; opacity:0.9;">Gestão de Usuários</span>
            </div>
        </div>
        <div>
            <a href="index.html" class="btn-voltar">⬅ Voltar ao Início</a>
        </div>
    </header>

    <main>
        <div class="form-card" id="card-formulario" style="display:none;">
            <h3 id="titulo-form" style="margin-top:0; border-bottom:1px solid #eee; padding-bottom:10px; color:#064e3b;">👤 Cadastro de Usuário</h3>
            
            <input type="hidden" id="usuario-id">
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <div>
                    <label>Nome Completo:</label>
                    <input type="text" id="nome" class="input-form" placeholder="Ex: Matheus Luiz">
                </div>
                <div>
                    <label>Login:</label>
                    <input type="text" id="login" class="input-form" placeholder="Ex: matheus">
                </div>
            </div>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <div>
                    <label>Senha:</label>
                    <input type="password" id="senha" class="input-form" placeholder="Deixe em branco se não mudar">
                </div>
                <div>
                    <label>Cargo:</label>
                    <select id="cargo" class="input-form">
                        <option value="COMUM">Usuário Comum</option>
                        <option value="OPERADOR">Operador (Fiscal)</option>
                        <option value="ADMIN">Administrador</option>
                    </select>
                </div>
            </div>

            <div style="border-top:1px dashed #ccc; padding-top:15px; margin-top:10px;">
                <h4 style="margin:0 0 10px 0; color:#0284c7;">🚙 Dados CNH (Opcional)</h4>
                <div style="display:flex; gap:15px; flex-wrap:wrap;">
                    <div style="flex:1;">
                        <label>Nº CNH:</label>
                        <input type="text" id="cnh-num" class="input-form">
                    </div>
                    <div style="width: 100px;">
                        <label>Categoria:</label>
                        <select id="cnh-cat" class="input-form">
                            <option value="">-</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="AB">AB</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                            <option value="E">E</option>
                        </select>
                    </div>
                    <div style="flex:1;">
                        <label>Validade:</label>
                        <input type="date" id="cnh-val" class="input-form">
                    </div>
                </div>
            </div>

            <div style="display:flex; gap:10px;">
                <button onclick="limparFormulario()" class="btn-moderno cinza btn-full">Cancelar</button>
                <button onclick="salvarUsuario()" class="btn-moderno verde btn-full">💾 Salvar Usuário</button>
            </div>
        </div>

        <h2 style="color:#111827; border-left:5px solid #064e3b; padding-left:15px;">Lista de Usuários</h2>
        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Login</th>
                        <th style="text-align:center;">Cat. CNH</th>
                        <th>Validade</th>
                        <th style="text-align:right;">Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-usuarios">
                    <tr><td colspan="5" style="text-align:center; padding:20px;">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:8081/usuarios'; 

        // PEGA O USUÁRIO LOGADO DO LOCALSTORAGE
        const usuarioLogadoJSON = localStorage.getItem('usuarioLogado');
        const usuarioLogado = usuarioLogadoJSON ? JSON.parse(usuarioLogadoJSON) : null;

        // SE FOR ADMIN, MOSTRA O FORMULÁRIO DE CADASTRO
        if(usuarioLogado && usuarioLogado.cargo === 'ADMIN') {
            document.getElementById('card-formulario').style.display = 'block';
        }

        async function carregarUsuarios() {
            try {
                const resp = await fetch(API_URL);
                if(!resp.ok) throw new Error("Erro conexão");
                const usuarios = await resp.json();
                const tbody = document.getElementById('lista-usuarios');
                tbody.innerHTML = '';

                if (usuarios.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">Nenhum usuário.</td></tr>';
                    return;
                }

                usuarios.forEach(u => {
                    let validadeHtml = '<span style="color:#ccc">-</span>';
                    if(u.validadeCnh) {
                        const hoje = new Date().toISOString().split('T')[0];
                        const dataF = new Date(u.validadeCnh).toLocaleDateString('pt-BR');
                        if(u.validadeCnh < hoje) validadeHtml = `<span style="color:red; font-weight:bold;">VENCIDA (${dataF})</span>`;
                        else validadeHtml = `<span style="color:green; font-weight:bold;">OK (${dataF})</span>`;
                    }
                    
                    const catHtml = u.categoriaCnh 
                        ? `<span style="background:#dbeafe; color:#1e40af; padding:4px 8px; border-radius:4px; font-weight:bold;">${u.categoriaCnh}</span>`
                        : '<span style="color:#ccc">-</span>';

                    // --- SEGURANÇA VISUAL ---
                    // Só cria os botões se quem está logado for ADMIN
                    let botoesAcao = '<span style="color:#999; font-size:0.8rem;">Acesso Restrito</span>';
                    
                    if (usuarioLogado && usuarioLogado.cargo === 'ADMIN') {
                        botoesAcao = `
                            <button onclick="editarUsuario(${u.id})" class="btn-moderno azul">✏</button>
                            <button onclick="excluirUsuario(${u.id})" class="btn-moderno vermelho">🗑</button>
                        `;
                    }
                    // ------------------------

                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${u.nome}</strong> <br><small style="color:#666">${u.cargo}</small></td>
                            <td>${u.login}</td>
                            <td style="text-align:center;">${catHtml}</td>
                            <td>${validadeHtml}</td>
                            <td style="text-align:right;">
                                ${botoesAcao}
                            </td>
                        </tr>`;
                });
            } catch (e) { console.error(e); }
        }

        // --- FUNÇÕES DE AÇÃO (SÓ ADMIN CONSEGUE EXECUTAR NO FINAL DAS CONTAS) ---

        async function salvarUsuario() {
            if(usuarioLogado.cargo !== 'ADMIN') return alert("Sem permissão!");

            const id = document.getElementById('usuario-id').value;
            const usuario = {
                nome: document.getElementById('nome').value,
                login: document.getElementById('login').value,
                senha: document.getElementById('senha').value || null,
                cargo: document.getElementById('cargo').value,
                numeroCnh: document.getElementById('cnh-num').value,
                categoriaCnh: document.getElementById('cnh-cat').value || null,
                validadeCnh: document.getElementById('cnh-val').value || null
            };
            if(!usuario.nome) return alert("Preencha o nome!");
            
            const metodo = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;
            try {
                await fetch(url, {method:metodo, headers:{'Content-Type':'application/json'}, body:JSON.stringify(usuario)});
                alert("Salvo!"); limparFormulario(); carregarUsuarios();
            } catch(e) { alert("Erro ao salvar."); }
        }

        async function excluirUsuario(id) {
            if(usuarioLogado.cargo !== 'ADMIN') return alert("Sem permissão!");
            if(confirm("Excluir?")) { await fetch(`${API_URL}/${id}`, {method:'DELETE'}); carregarUsuarios(); }
        }

        async function editarUsuario(id) {
            if(usuarioLogado.cargo !== 'ADMIN') return alert("Sem permissão!");
            const resp = await fetch(`${API_URL}/${id}`);
            const u = await resp.json();
            document.getElementById('usuario-id').value = u.id;
            document.getElementById('nome').value = u.nome;
            document.getElementById('login').value = u.login;
            document.getElementById('cargo').value = u.cargo;
            document.getElementById('cnh-num').value = u.numeroCnh || '';
            document.getElementById('cnh-cat').value = u.categoriaCnh || '';
            document.getElementById('cnh-val').value = u.validadeCnh || '';
            document.getElementById('senha').placeholder = "Nova senha...";
            document.getElementById('titulo-form').innerText = `✏️ Editando: ${u.nome}`;
            
            // Se o formulário estiver escondido (por bug), força aparecer
            document.getElementById('card-formulario').style.display = 'block';
            
            window.scrollTo({top:0, behavior:'smooth'});
        }

        function limparFormulario() {
            document.getElementById('usuario-id').value = '';
            document.getElementById('nome').value = '';
            document.getElementById('login').value = '';
            document.getElementById('senha').value = '';
            document.getElementById('cnh-num').value = '';
            document.getElementById('cnh-cat').value = '';
            document.getElementById('cnh-val').value = '';
            document.getElementById('titulo-form').innerText = "👤 Cadastro de Usuário";
        }

        carregarUsuarios();
    </script>
</body>
</html>
